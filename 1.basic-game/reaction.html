<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>반응속도 테스트</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #F8FAFC; color: #0F172A; margin: 0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
  }
  h1 { font-size: 34px; margin: 0; }
  .desc { color: #64748B; margin: 0; font-size: 17px; }
  #board {
    width: 460px; height: 240px; border-radius: 16px;
    background: #E2E8F0; color: #475569;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; cursor: pointer; user-select: none;
  }
  #board.wait { background: #FCA5A5; color: #7F1D1D; }
  #board.go   { background: #4ADE80; color: #14532D; }
  button {
    font-size: 19px; padding: 13px 32px; border: 0; border-radius: 10px;
    background: #0F172A; color: #FFFFFF; cursor: pointer;
  }
  #result { font-size: 40px; font-weight: 800; margin: 0; height: 48px; }
</style>
</head>
<body>

<h1>반응속도 테스트</h1>
<p class="desc">시작을 누르고, 화면이 <b>초록색</b>이 되면 클릭하세요.</p>

<div id="board">시작을 누르세요</div>
<button id="startBtn">시작</button>
<p id="result"></p>

<script>
  const board = document.getElementById("board");
  const startBtn = document.getElementById("startBtn");
  const result = document.getElementById("result");

  let startTime = 0;
  let waiting = false;  // 초록을 기다리는 중
  let ready = false;    // 초록이 켜짐

  startBtn.onclick = start;
  board.onclick = press;

  function start() {
    result.textContent = "";
    board.textContent = "기다리세요...";
    board.className = "wait";
    waiting = true;
    ready = false;
    setTimeout(turnGreen, 2000);   // 항상 2초 뒤에 초록
  }

  function turnGreen() {
    if (!waiting) return;
    board.textContent = "지금 클릭!";
    board.className = "go";
    ready = true;
    startTime = Date.now();
  }

  function press() {
    if (!ready) return;            // 초록이 아니면 아무 일도 안 일어남
    const ms = Date.now() - startTime;
    result.textContent = ms + "ms";
    board.textContent = "다시 하려면 시작을 누르세요";
    board.className = "";
    waiting = false;
    ready = false;
  }
</script>

</body>
</html>
