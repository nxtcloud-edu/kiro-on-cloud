<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>숫자 맞히기</title>
<style>
  body {
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #F8FAFC; color: #0F172A; margin: 0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
  }
  h1 { font-size: 34px; margin: 0; }
  .desc { color: #64748B; margin: 0; font-size: 17px; }
  .row { display: flex; gap: 12px; }
  input {
    font-size: 24px; padding: 12px 16px; width: 160px; text-align: center;
    border: 2px solid #CBD5E1; border-radius: 10px; outline: none;
  }
  input:focus { border-color: #0F172A; }
  button {
    font-size: 19px; padding: 13px 28px; border: 0; border-radius: 10px;
    background: #0F172A; color: #FFFFFF; cursor: pointer;
  }
  button.ghost { background: #E2E8F0; color: #334155; }
  #message { font-size: 34px; font-weight: 800; margin: 0; height: 42px; }
  #message.up   { color: #2563EB; }
  #message.down { color: #DB2777; }
  #message.win  { color: #15803D; }
</style>
</head>
<body>

<h1>숫자 맞히기</h1>
<p class="desc">1부터 100 사이의 숫자를 맞혀보세요.</p>

<div class="row">
  <input id="input" type="number" min="1" max="100" placeholder="숫자">
  <button id="checkBtn">확인</button>
  <button id="resetBtn" class="ghost">다시</button>
</div>

<p id="message"></p>

<script>
  const input = document.getElementById("input");
  const checkBtn = document.getElementById("checkBtn");
  const resetBtn = document.getElementById("resetBtn");
  const message = document.getElementById("message");

  let answer = 0;

  checkBtn.onclick = check;
  resetBtn.onclick = reset;
  input.onkeydown = (e) => { if (e.key === "Enter") check(); };

  reset();

  function reset() {
    answer = Math.floor(Math.random() * 100) + 1;   // 1 ~ 100
    message.textContent = "";
    message.className = "";
    input.value = "";
    input.focus();
  }

  function check() {
    const guess = Number(input.value);

    if (guess === answer) {
      message.textContent = "정답!";
      message.className = "win";
    } else if (guess < answer) {
      message.textContent = "더 큰 수";
      message.className = "up";
    } else {
      message.textContent = "더 작은 수";
      message.className = "down";
    }

    input.value = "";
    input.focus();
  }
</script>

</body>
</html>
